server:
  port: 0

spring:
  application:
    name: order-service-test
  datasource:
    url: jdbc:h2:mem:order_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

cart:
  service:
    url: http://localhost:8083

inventory:
  service:
    url: http://localhost:8086

payment:
  service:
    url: http://localhost:8085

notification:
  service:
    url: http://localhost:8087

logging:
  level:
    root: WARN
    com.cloudcart.order: INFO
