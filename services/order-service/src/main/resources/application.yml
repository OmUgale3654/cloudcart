server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudcart_order}
    username: ${SPRING_DATASOURCE_USERNAME:cloudcart_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cloudcart_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

cart:
  service:
    url: ${CART_SERVICE_URL:http://localhost:8083}

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8086}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.cloudcart.order: DEBUG
