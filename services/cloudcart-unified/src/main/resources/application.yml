server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: cloudcart-unified
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudcart}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:cloudcart_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:cloudcart_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/unified

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

# Loopback URLs for OpenFeign clients in unified mode
product:
  service:
    url: http://localhost:${server.port:8080}
inventory:
  service:
    url: http://localhost:${server.port:8080}
cart:
  service:
    url: http://localhost:${server.port:8080}
payment:
  service:
    url: http://localhost:${server.port:8080}
notification:
  service:
    url: http://localhost:${server.port:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
