name: CloudCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test All Microservices
        run: ./mvnw clean test

      - name: Package Microservices JARs
        run: ./mvnw clean package -DskipTests=true

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: services/*/target/*.jar

  frontend-test-and-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/cloudcart-frontend

  docker-and-deploy:
    name: Build & Push Docker Images
    needs: [ backend-test-and-build, frontend-test-and-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Microservice Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("api-gateway" "user-service" "product-service" "inventory-service" "cart-service" "order-service" "payment-service" "notification-service")
          for svc in "${SERVICES[@]}"; do
            echo "Building services/$svc..."
            docker build -t $ECR_REGISTRY/cloudcart-$svc:$IMAGE_TAG -t $ECR_REGISTRY/cloudcart-$svc:latest services/$svc
            docker push $ECR_REGISTRY/cloudcart-$svc:$IMAGE_TAG
            docker push $ECR_REGISTRY/cloudcart-$svc:latest
          done

          echo "Building frontend..."
          docker build -t $ECR_REGISTRY/cloudcart-frontend:$IMAGE_TAG -t $ECR_REGISTRY/cloudcart-frontend:latest frontend
          docker push $ECR_REGISTRY/cloudcart-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cloudcart-frontend:latest
