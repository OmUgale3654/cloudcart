version: '3.8'

networks:
  cloudcart-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Host with 7 isolated service databases)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudcart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
      POSTGRES_MULTIPLE_DATABASES: cloudcart_user,cloudcart_product,cloudcart_inventory,cloudcart_cart,cloudcart_order,cloudcart_payment,cloudcart_notification
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-multi-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multi-postgres-databases.sh:ro
    networks:
      - cloudcart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudcart_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # User Service (Port 8081)
  # ----------------------------------------------------------------------------
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: cloudcart-user-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_user
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Inventory Service (Port 8086)
  # ----------------------------------------------------------------------------
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: cloudcart-inventory-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_inventory
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Product Service (Port 8082)
  # ----------------------------------------------------------------------------
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: cloudcart-product-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_product
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Cart Service (Port 8083)
  # ----------------------------------------------------------------------------
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cloudcart-cart-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_cart
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8086
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Payment Service (Port 8085)
  # ----------------------------------------------------------------------------
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: cloudcart-payment-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_payment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Notification Service (Port 8087)
  # ----------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: cloudcart-notification-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_notification
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Order Service (Port 8084) - Saga Orchestrator
  # ----------------------------------------------------------------------------
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: cloudcart-order-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudcart_order
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cloudcart_pass}
      CART_SERVICE_URL: http://cart-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # API Gateway (Port 8080)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: cloudcart-api-gateway
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      INVENTORY_SERVICE_URL: http://inventory-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
    networks:
      - cloudcart-network

  # ----------------------------------------------------------------------------
  # Frontend - Angular Single Page Application (Port 4200 / 80)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudcart-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - cloudcart-network
