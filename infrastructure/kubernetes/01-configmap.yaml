apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcart-config
  namespace: cloudcart
  labels:
    app.kubernetes.io/part-of: cloudcart-platform
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  API_GATEWAY_URL: "http://api-gateway:8080"
  USER_SERVICE_URL: "http://user-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  CART_SERVICE_URL: "http://cart-service:8083"
  ORDER_SERVICE_URL: "http://order-service:8084"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  INVENTORY_SERVICE_URL: "http://inventory-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8087"
  FRONTEND_URL: "http://frontend:80"
