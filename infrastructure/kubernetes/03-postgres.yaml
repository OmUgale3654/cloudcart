apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cloudcart-platform
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    set -u

    function create_user_and_database() {
      local database=$1
      echo "Initializing database '$database'..."
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $database'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$database')\gexec
        GRANT ALL PRIVILEGES ON DATABASE $database TO $POSTGRES_USER;
    EOSQL
    }

    if [ -n "${POSTGRES_MULTIPLE_DATABASES:-}" ]; then
      echo "Multiple database creation requested: $POSTGRES_MULTIPLE_DATABASES"
      for db in $(echo $POSTGRES_MULTIPLE_DATABASES | tr ',' ' '); do
        create_user_and_database $db
      done
      echo "All CloudCart databases created successfully!"
    fi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cloudcart-platform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cloudcart-platform
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: cloudcart-platform
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: cloudcart_master
            - name: POSTGRES_MULTIPLE_DATABASES
              value: "cloudcart_user,cloudcart_product,cloudcart_inventory,cloudcart_cart,cloudcart_order,cloudcart_payment,cloudcart_notification"
          ports:
            - containerPort: 5432
              name: postgresql
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init-databases.sh
              subPath: init-databases.sh
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U cloudcart_user -d cloudcart_master
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U cloudcart_user -d cloudcart_master
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi
